name: Update playlists

on:
  schedule:
    # Saturday 18:00 UTC = 20:00 Israel in winter, 21:00 in summer
    - cron: "0 18 * * 6"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only print the plan, don't change playlists"
        type: boolean
        default: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      # config.yaml isn't in the repo. Its content lives in a repository
      # variable (Settings -> Secrets and variables -> Actions -> Variables).
      - name: Write config.yaml
        env:
          CONFIG: ${{ vars.PODCAST_FIT_CONFIG }}
        run: |
          if [ -z "$CONFIG" ]; then
            echo "Repository variable PODCAST_FIT_CONFIG is not set" >&2
            exit 1
          fi
          printf '%s\n' "$CONFIG" > config.yaml

      - name: Update playlists
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m podcast_fit.main --dry-run
          else
            python -m podcast_fit.main
          fi
